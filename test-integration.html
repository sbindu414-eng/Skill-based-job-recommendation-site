<!DOCTYPE html>
<html>
<head>
    <title>Integration Test</title>
</head>
<body>
    <h1>Integration Test</h1>
    <button onclick="testSkillsUpdate()">Test Skills Update</button>
    <button onclick="testJobRecommendations()">Test Job Recommendations</button>
    <div id="result"></div>

    <script>
        async function testSkillsUpdate() {
            try {
                const response = await fetch('http://localhost:5000/api/user/1/skills', {
                    method: 'PUT',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        skills: ['Python', 'Django', 'PostgreSQL', 'Docker']
                    })
                });
                
                const data = await response.json();
                document.getElementById('result').innerHTML = `<pre>${JSON.stringify(data, null, 2)}</pre>`;
            } catch (error) {
                document.getElementById('result').innerHTML = `<p>Error: ${error.message}</p>`;
            }
        }

        async function testJobRecommendations() {
            try {
                const response = await fetch('http://localhost:5000/api/user/1/recommendations');
                const data = await response.json();
                document.getElementById('result').innerHTML = `<pre>${JSON.stringify(data, null, 2)}</pre>`;
            } catch (error) {
                document.getElementById('result').innerHTML = `<p>Error: ${error.message}</p>`;
            }
        }
    </script>
</body>
</html>
